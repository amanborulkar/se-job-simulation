[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --junitxml=reports/junit.xml
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:reports/coverage.xml
markers =
    unit: pure unit tests (no network, no browser)
    integration: tests that spin up the Flask test client
